<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedHirely</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#DCE7F6] h-screen flex overflow-hidden">

    <aside class="w-64 bg-white h-full flex flex-col border-r border-gray-200 z-10">
        <div class="p-6">
            <span class="text-[#2B6CB0] font-bold text-2xl tracking-wide">MedHirely</span>
        </div>

        <nav class="flex-1 px-4 space-y-1">
            <a href="#" class="flex items-center space-x-3 bg-[#EBF4FF] text-[#2B6CB0] font-semibold px-4 py-3 rounded-lg border-r-4 border-[#2B6CB0]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="#" class="flex items-center space-x-3 text-gray-700 font-medium px-4 py-3 rounded-lg hover:bg-gray-50 transition-colors">
                <span class="pl-8">Post Shifts</span>
            </a>
            <a href="#" class="flex items-center space-x-3 text-gray-700 font-medium px-4 py-3 rounded-lg hover:bg-gray-50 transition-colors">
                <span class="pl-8">Active Shifts</span>
            </a>
            <a href="#" class="flex items-center space-x-3 text-gray-700 font-medium px-4 py-3 rounded-lg hover:bg-gray-50 transition-colors">
                <span class="pl-8">Payment</span>
            </a>
            <a href="#" class="flex items-center space-x-3 text-gray-700 font-medium px-4 py-3 rounded-lg hover:bg-gray-50 transition-colors">
                <span class="pl-8">Shifts History</span>
            </a>
            <a href="#" class="flex items-center space-x-3 text-gray-700 font-medium px-4 py-3 rounded-lg hover:bg-gray-50 transition-colors">
                <span class="pl-8">Staff Ratings</span>
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-full relative">
        
        <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-8 z-0">
            <div class="relative w-64">
                <input type="text" placeholder="Search..." class="w-full pl-4 pr-10 py-1.5 border border-gray-400 rounded-full text-sm bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                <div class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0x"></path>
                    </svg>
                </div>
            </div>
            <button class="relative p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-full transition-colors focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                </svg>
                <span class="absolute top-1 right-1.5 block h-2.5 w-2.5 rounded-full bg-blue-500 ring-2 ring-white"></span>
            </button>
        </header>

        <main class="flex-1 flex items-center justify-center p-6">
            
            <div class="w-full max-w-md flex flex-col items-center text-center px-4">
                
                <div class="relative mb-6">
                    <div class="w-24 h-24 bg-[#A3D1A5] rounded-full flex items-center justify-center text-[#047A15]">
                        <svg class="w-14 h-14" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <div class="absolute bottom-1 right-1 w-6 h-6 bg-[#A3D1A5] rounded-full flex items-center justify-center border-2 border-[#DCE7F6]">
                        <svg class="w-4 h-4 text-[#047A15]" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </div>

                <h2 class="text-xl font-bold text-gray-900 tracking-tight leading-tight">
                    Would you rehire<br>Eseyin Felicia?
                </h2>

                <p class="text-gray-600 text-sm font-medium mt-4 max-w-xs">
                    Add this worker to your preferred staffing pool?
                </p>

                <div class="w-full mt-8 space-y-3 px-6">
                    <button class="w-full bg-[#047A15] text-white font-semibold py-2.5 px-4 rounded-md shadow-sm hover:bg-emerald-700 transition-colors">
                        Yes, Rehire
                    </button>
                    <button class="w-full bg-transparent border border-red-400 text-red-600 font-semibold py-2.5 px-4 rounded-md hover:bg-red-50 transition-colors">
                        No, Do Not Rehire
                    </button>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
