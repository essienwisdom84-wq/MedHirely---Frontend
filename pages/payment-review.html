<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Review Payment</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#EAF2FF] min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md hidden md:flex flex-col justify-between">
    
    <div class="logo">
  <img src="../assets/images/logo.png" alt="MedHire Logo" width="140">
</div>

      <nav class="mt-8">
        <ul class="space-y-4 px-6">
          <li class="bg-blue-100 text-blue-600 p-3 rounded-lg font-semibold">
            Dashboard
          </li>

          <li class="text-gray-700">Post Shifts</li>
          <li class="text-gray-700">Active Shifts</li>
          <li class="text-gray-700">Payment</li>
          <li class="text-gray-700">Shifts History</li>
          <li class="text-gray-700">Staff Ratings</li>
        </ul>
      </nav>
    </div>

    <div class="p-6">
      <button class="text-red-500 font-semibold">
        Log out
      </button>
    </div>

  </aside>

  <!-- Main Content -->
  <main class="flex-1">

    <!-- Topbar -->
    <header class="bg-white h-20 shadow-sm flex items-center justify-between px-8">
      
      <input
        type="text"
        placeholder="Search..."
        class="border rounded-full px-4 py-2 w-64 outline-none"
      />

      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-full bg-gray-300"></div>

        <div>
          <h3 class="font-semibold text-sm">
            St Luke's Hospital
          </h3>

          <p class="text-xs text-gray-500">
            Facility Profile
          </p>
        </div>
      </div>

    </header>

    <!-- Body -->
    <section class="p-10 flex flex-col lg:flex-row items-center justify-center gap-16">

      <!-- Card -->
      <div class="bg-white p-10 rounded-xl shadow-md w-full max-w-lg">

        <h2 class="font-bold text-2xl mb-8">
          Review Hours
        </h2>

        <div class="space-y-6">

          <div class="border-b pb-4">
            <p class="text-gray-500 text-sm">Shift Hours</p>
            <h3 class="font-semibold text-lg">11.58hrs</h3>
          </div>

          <div class="border-b pb-4">
            <p class="text-gray-500 text-sm">Hourly Rate</p>
            <h3 class="font-semibold text-lg">₦15,000</h3>
          </div>

          <div>
            <p class="text-gray-500 text-sm">Total Due</p>

            <h1 class="text-4xl font-bold text-green-600 mt-2">
              ₦173,700
            </h1>
          </div>

        </div>

        <!-- Notice -->
        <div class="bg-blue-50 rounded-lg p-4 mt-8 flex items-center justify-between">

          <p class="text-sm text-gray-700 font-medium">
            Please review the reported hours before approving payments.
          </p>

          <span class="text-3xl">⏰</span>

        </div>

        <!-- Button -->
        <button
          onclick="approvePayment()"
          class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg mt-10 font-semibold transition"
        >
          Approve Payment
        </button>

      </div>

      <!-- Illustration -->
      <div class="hidden lg:block">
        <img
          src="https://cdn-icons-png.flaticon.com/512/2920/2920244.png"
          alt="clock illustration"
          class="w-72"
        />
      </div>

    </section>

  </main>

  <script src="../js/review.js"></script>
</body>
</html>
