            data-tab="active-shifts"
            class="menu-item flex items-center px-4 py-2 text-sm font-bold text-gray-900 rounded-md hover:bg-gray-100/80 transition-all pl-[38px]"
          >
            Active Shifts
          </a>

            href="#"
            data-tab="payment"
            class="menu-item flex items-center px-4 py-2 text-sm font-bold text-gray-900 rounded-md hover:bg-gray-100/80 transition-all pl-[38px]"
          >
            Payment
          </a>

          <a
            href="#"
            data-tab="shifts-history"
            class="menu-item flex items-center px-4 py-2 text-sm font-bold text-gray-900 rounded-md hover:bg-gray-100/80 transition-all pl-[38px]"
          >
            Shifts History
          </a>

            href="#"
            data-tab="staff-ratings"
            class="menu-item flex items-center px-4 py-2 text-sm font-bold text-gray-900 rounded-md hover:bg-gray-100/80 transition-all pl-[38px]"

      </div>

      <div class="pb-6 px-4 space-y-14">
        <a
          href="#"
          data-tab="admin"
          class="menu-item flex items-center px-4 py-2 text-sm font-bold text-black rounded-md hover:bg-gray-100/80 transition-all pl-[38px]"
        >
          Admin
        </a>
        <a
          href="#"
          data-tab="logout"
          class="menu-item flex items-center px-4 py-2 text-sm font-bold text-gray-900 rounded-md hover:bg-red-50 hover:text-red-600 transition-all pl-[38px]"
        >
          Log out
        </a>

    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
      <header
        class="h-16 bg-white border-b border-gray-900 border-1-4 px-8 flex items-center justify-between flex-shrink-0 z-10"
      >
        <div class="relative w-64">
          <input
            type="text"
            placeholder="Search.."
            class="w-full focus:placeholder-transparent bg-white border border-black rounded-full pl-4 pr-10 py-1 text-sm text-gray-800 placeholder-black focus:outline-none focus:border-[#2f74fa] focus:ring-1 focus:ring-[#2f74fa]"
          />
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-4 h-4 text-gray-500 absolute right-3.5 top-2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"
            />
          </svg>
        </div>

        <div class="flex items-center gap-6">
          <div class="flex items-center gap-8">
            <div class="relative cursor-pointer">
              <svg
                class="w-7 h-7 text-gray-700"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                viewBox="0 0 24 24"
              >

                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"
                />
              </svg>
              <span
                class="absolute -top-1 -right-1 bg-[#2f74fa] text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full border border-white"
                >4</span
              >
            </div>

            
            <div class="flex items-center gap-3 cursor-pointer">
              <div class="w-10 h-10 rounded-full bg-gray-300"></div>
              <div class="flex flex-col">
                <span class="text-[13px] font-bold text-black leading-tight"
                  >St Luke's Hospital</span
                >
                <span class="text-[11px] font-medium text-gray-500"
                  >Facility Profile</span
                >
              </div>
              <svg
                class="w-4 h-4 text-gray-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M19 9l-7 7-7-7"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-12">
        <div class="max-w-xl">
          <div class="mb-8">
            <h2 class="text-base font-black text-gray-900 tracking-wide mb-4">
              Worker
            </h2>

            <div class="flex items-center gap-4">
              <img
                src="https://res.cloudinary.com/deug7yxlv/image/upload/v1780442039/Ellipse_22_aeepig.png"
                alt="Eseyin Felicia Profile"
                class="w-16 h-16 rounded-full object-cover border border-gray-300 shadow-xs select-none pointer-events-none"
              />

              <span class="text-base font-black text-gray-900 tracking-wide"
                >Eseyin Felicia, RN</span
              >
            </div>
          </div>

          <div class="mb-8">
            <h3 class="text-base font-black text-gray-900 tracking-wide mb-5">
              Rate your worker
            </h3>

            <div class="flex items-center gap-4" id="starRatingRow">
              <button
                data-index="1"
                class="star-btn text-[#2f74fa] hover:scale-110 transition focus:outline-none"
              >
                <svg class="w-10 h-10 fill-currentColor" viewBox="0 0 24 24">
                  <path
                    d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                  />
                </svg>
              </button>

              <button
                data-index="2"
                class="star-btn text-[#2f74fa] hover:scale-110 transition focus:outline-none"
              >
                <svg class="w-10 h-10 fill-currentColor" viewBox="0 0 24 24">
                  <path
                    d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                  />
                </svg>
              </button>

              <button
                data-index="3"
                class="star-btn text-[#2f74fa] hover:scale-110 transition focus:outline-none"
              >
                <svg class="w-10 h-10 fill-currentColor" viewBox="0 0 24 24">
                  <path
                    d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                  />
                </svg>
              </button>
              <button
                data-index="4"
                class="star-btn text-[#2f74fa] hover:scale-110 transition focus:outline-none"
              >
                <svg class="w-10 h-10 fill-currentColor" viewBox="0 0 24 24">
                  <path
                    d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                  />
                </svg>
              </button>
              <button
                data-index="5"
                class="star-btn text-[#2f74fa] hover:scale-110 transition focus:outline-none"
              >
                <svg class="w-10 h-10 fill-currentColor" viewBox="0 0 24 24">
                  <path
                    d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div class="mb-8">
            <label
              for="reviewInput"
              class="block text-sm font-black text-gray-900 tracking-wide mb-3"
              >Write a review (optional)</label
            >

            <div
              class="bg-white rounded-lg border border-gray-400 p-4 shadow-xs relative"
            >
              <textarea
                id="reviewInput"
                rows="5"
                maxlength="500"
                class="w-full focus:placeholder-transparent bg-transparent border-none outline-none resize-none text-sm font-bold text-black leading-relaxed focus:ring-0"
                placeholder="write your review..."
              ></textarea>

              <div
                class="absolute bottom-2 right-3 text-xs font-bold text-gray-500 tracking-wide"
                id="charCounter"
              ></div>
            </div>
          </div>

          <button
            id="submitReviewBtn"
            class="w-full bg-[#2563eb] text-white font-bold text-sm py-2.5 rounded-lg border border-transparent shadow-md hover:bg-blue-600 transition active:scale-[0.99] focus:outline-none"
          >
            Submit Review
          </button>
        </div>
      </main>
    </div>
