<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Review Payment</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#EAF2FF] min-h-screen flex">

  <!-- Mobile Overlay -->
  <div
    id="overlay"
    class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"
  ></div>

  <!-- Sidebar -->
  <aside
    id="sidebar"
    class="fixed md:relative top-0 left-0 h-full w-64 bg-white shadow-md z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col justify-between"
  >
    <div>
      <!-- Logo -->
      <div class="p-6">
        <img
          src="../assets/images/logo.png"
          alt="MedHire Logo"
          class="w-36"
        />
      </div>

      <!-- Navigation -->
      <nav class="mt-4">
        <ul class="space-y-2 px-6">
          <li class="bg-blue-100 text-blue-600 p-3 rounded-lg font-semibold cursor-pointer">
            Dashboard
          </li>

          <li class="text-gray-700 p-3 cursor-pointer hover:bg-gray-100 rounded-lg">
            Post Shifts
          </li>

          <li class="text-gray-700 p-3 cursor-pointer hover:bg-gray-100 rounded-lg">
            Active Shifts
          </li>

          <li class="text-gray-700 p-3 cursor-pointer hover:bg-gray-100 rounded-lg">
            Payment
          </li>

          <li class="text-gray-700 p-3 cursor-pointer hover:bg-gray-100 rounded-lg">
            Shifts History
          </li>

          <li class="text-gray-700 p-3 cursor-pointer hover:bg-gray-100 rounded-lg">
            Staff Ratings
          </li>
        </ul>
      </nav>
    </div>

    <div class="p-6">
      <button class="text-red-500 font-semibold">
        Log Out
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 min-w-0">

    <!-- Header -->
    <header
      class="bg-white shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4 p-4 sm:px-8"
    >

      <div class="flex items-center gap-4 w-full sm:w-auto">

        <!-- Mobile Menu Button -->
        <button
          id="menuBtn"
          class="md:hidden text-2xl font-bold"
        >
          ☰
        </button>

        <input
          type="text"
          placeholder="Search..."
          class="border rounded-full px-4 py-2 w-full sm:w-64 outline-none"
        />
      </div>

      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-full bg-gray-300"></div>

        <div>
          <h3 class="font-semibold text-sm">
            St Luke's Hospital
          </h3>

          <p class="text-xs text-gray-500">
            Facility Profile
          </p>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <section
      class="p-4 sm:p-6 lg:p-10 flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-16"
    >

      <!-- Review Card -->
      <div
        class="bg-white p-5 sm:p-8 lg:p-10 rounded-xl shadow-md w-full max-w-lg"
      >

        <h2 class="font-bold text-2xl mb-8">
          Review Hours
        </h2>

        <div class="space-y-6">

          <div class="border-b pb-4">
            <p class="text-gray-500 text-sm">
              Shift Hours
            </p>

            <h3 class="font-semibold text-lg">
              11.58hrs
            </h3>
          </div>

          <div class="border-b pb-4">
            <p class="text-gray-500 text-sm">
              Hourly Rate
            </p>

            <h3 class="font-semibold text-lg">
              ₦15,000
            </h3>
          </div>

          <div>
            <p class="text-gray-500 text-sm">
              Total Due
            </p>

            <h1 class="text-4xl font-bold text-green-600 mt-2">
              ₦173,700
            </h1>
          </div>
        </div>

        <!-- Notice -->
        <div
          class="bg-blue-50 rounded-lg p-4 mt-8 flex flex-col sm:flex-row items-center gap-4 sm:justify-between"
        >
          <p class="text-sm text-gray-700 font-medium text-center sm:text-left">
            Please review the reported hours before approving payments.
          </p>

          <span class="text-3xl">
            ⏰
          </span>
        </div>

        <!-- Button -->
        <a
          href="paymentReleased.html"
          class="block w-full text-center bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg mt-10 font-semibold transition"
        >
          Approve Payment
        </a>

      </div>

      <!-- Illustration -->
      <div class="hidden lg:block">
        <img
          src="https://cdn-icons-png.flaticon.com/512/2920/2920244.png"
          alt="Clock Illustration"
          class="w-72"
        />
      </div>

    </section>

  </main>

  <script src="../js/review.js"></script>
</body>
</html>
