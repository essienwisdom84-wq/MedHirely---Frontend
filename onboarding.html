<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>MedHirely</title>
  </head>
  <body>
    <header>
     <section>
       <nav class="flex justify-between p-6 m-3">
         <h1 class="font-bold text-blue-600 text-3xl">MedHirely</h1>
         <a href="#" class="font-semibold text-xl hover:text-blue-600">Home</a>
         <a href="#" class="font-semibold text-xl hover:text-blue-600">For Facilities</a>
         <a href="#" class="font-semibold text-xl hover:text-blue-600">About</a>
         <button class="text-blue-600 border-2 border-blue-600 text-xl rounded-2xl px-4 font-semibold hover:bg-blue-600 hover:text-white">
            Facility sign up
         </button>
         <button class="bg-blue-600 text-white text-xl rounded-2xl px-4 font-semibold hover:bg-white hover:text-blue-600 border-2 border-blue-600">
            Facility login
         </button>
       </nav>
     </section>   
    </header>
    <main>
      <Section>
        <div class="bg-blue-500 p-4 rounded-xl m-5 text-white">
          <h1 class="text-5xl font-bold relative">Never suffer a staffing <br>
             crises again...</h1>
             
        </div>

      </Section>
      <div class="flex justify-items-end justify-end m-2 p-2">
        <button class="border-2 border-blue-600 text-blue-600 text-xl rounded-2xl px-4 font-semibold hover:bg-blue-600 hover:text-white">
            Sign up
        </button>
        <button class="border-2 border-blue-600 bg-blue-600 text-white text-xl rounded-2xl px-4 mx-2 font-semibold hover:bg-white hover:text-blue-600">
            Log in
        </button>
      </div>
      
    </main>
    <footer>
      <div class="bg-blue-500 text-white">
        <div>
          <p>MedHirely connects <i>hospitals, clinics, and pharmacies</i> with qualified Locum Professionals...</p>
          <img src=".\images\doctors-shaking-hands-with-patient-standing-corridor-hospital 1.png" alt="doctors-shaking-hands-with-patient-standing-corridor-hospital">
        </div>
        <div>
          <p>... ensuring that every facility is properly staffed, at all times.</p>
          <img src=".\images\african-american-nurse-using-digital-tablet-treatment 1.png" alt="african-american-nurse-using-digital-tablet-treatment ">
        </div>
      </div>
     
    </footer>
  </body>
</html>
