<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="registration-container">
        <h2>Quick Registration</h2>

        <div class="stepper">
            <div class="step active">
              <div class="phone-types">       
                    <label class="radio-label"><input type="radio" name="phoneType" value="Basic"  id="ra"> Basic Information</label>
                    <label class="radio-label"><input type="radio" name="phoneType" value="Insurance"  id="ra1" checked> Insurance Details</label>
                    <label class="radio-label"><input type="radio" name="phoneType" value="Payment" id="ra2"> Payment</label>
                </div>
            </div>
        </div>

        <form id="registrationForm" class="form-grid">
            
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" value="" placeholder="firstName">
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" value="" placeholder="lastName">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email address">
            </div>

            <div class="form-group">
                <label for="preferredName">Preferred Name</label>
                <input type="text" id="preferredName" value="" placeholder="Name">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="text" id="dob" value="" placeholder="MM/DD/YYYY">
            </div>

            <div class="form-group">
                <label for="referredBy">Referred by</label>
                <input type="text" id="referredBy">
            </div>

            <div class="form-group gender-section">
                <label>Gender</label>
                <div class="gender-options">
                    <button type="button" class="btn-gender active">Female</button>
                    <button type="button" class="btn-gender">Male</button>
                    <button type="button" class="btn-gender">Other</button>
                </div>
            </div>

            <div class="form-group phone-section">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="Enter phone number">
                <div class="phone-types">
                    <label class="radio-label"><input type="radio" name="phoneType" value="home"> Home</label>
                    <label class="radio-label"><input type="radio" name="phoneType" value="mobile" checked> Mobile</label>
                    <label class="radio-label"><input type="radio" name="phoneType" value="work"> Work</label>
                </div>
            </div>

            <div class="form-footer">
                <button type="button" class="btn-cancel">Cancel</button>
                <button type="submit" class="btn-submit">Save & Next</button>
            </div>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
